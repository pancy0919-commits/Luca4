<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>小卡漫劇場 第 1 集：皮皮與小怪獸的寶箱</title>
    <style>
        body {
            background-color: #282c34;
            color: white;
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h2 {
            color: #61dafb;
            margin-bottom: 10px;
        }
        /* 大螢幕卡通劇場舞臺 (850px x 480px) */
        .stage {
            width: 850px;
            height: 480px;
            background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
            border: 4px solid #333;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: box-shadow 0.5s ease;
        }
        /* 地面裝飾 */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90px;
            background-color: #7cfc00;
            border-top: 4px solid #228b22;
        }
        /* 角色：主角皮皮 */
        .character-pipi {
            position: absolute;
            bottom: 80px;
            left: 100px;
            font-size: 60px;
            transition: all 0.5s ease;
            z-index: 5;
        }
        /* 角色：小怪獸 */
        .character-monster {
            position: absolute;
            bottom: 80px;
            right: 120px;
            font-size: 60px;
            transition: all 0.5s ease;
            z-index: 5;
        }
        /* 對話框氣泡 */
        .speech-bubble {
            position: absolute;
            background: white;
            color: black;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            max-width: 280px;
            display: none;
            z-index: 10;
        }
        .bubble-pipi {
            bottom: 160px;
            left: 90px;
        }
        .bubble-monster {
            bottom: 160px;
            right: 110px;
        }
        /* 像素風與特效樣式 */
        .pixel-item {
            position: absolute;
            bottom: 80px;
            left: 380px;
            font-size: 40px;
            display: block;
            transition: all 0.5s ease;
        }
        .magic-key {
            position: absolute;
            bottom: 130px;
            left: 390px;
            font-size: 30px;
            opacity: 0;
            transition: all 0.8s ease;
        }
        .cloud {
            position: absolute;
            top: 30px;
            font-size: 30px;
            animation: moveCloud 12s linear infinite;
        }
        @keyframes moveCloud {
            0% { left: -50px; }
            100% { left: 900px; }
        }
        /* 片尾特效樣式 */
        .ending-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 20;
        }
        .ending-title {
            font-size: 36px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
        }
        .ending-sub {
            font-size: 20px;
            color: #00d2ff;
        }
        .control-panel {
            margin-top: 20px;
            font-size: 16px;
            color: #ffd700;
        }
    </style>
</head>
<body>

    <h2>小卡漫劇場 第 1 集：皮皮與小怪獸的寶箱</h2>
    
    <div class="stage">
        <div class="ground"></div>
        
        <!-- 角色區 -->
        <div id="pipi" class="character-pipi">👦</div>
        <div id="monster" class="character-monster">👾</div>
        
        <!-- 對話框 -->
        <div id="bubblePipi" class="speech-bubble bubble-pipi">嗨！今天天氣真好呢～</div>
        <div id="bubbleMonster" class="speech-bubble bubble-monster">吼嚕嚕！我肚子餓了啦！</div>

        <!-- 像素風道具與寶箱 -->
        <div id="pixelBox" class="pixel-item">📦</div>
        <div id="magicKey" class="magic-key">🔑</div>

        <!-- 片尾畫面 -->
        <div id="endingScreen" class="ending-overlay">
            <div class="ending-title">🌟 第 1 集 完結 🌟</div>
            <div class="ending-sub">「lmail 知識小平台」成功啟動！</div>
        </div>
    </div>

    <div class="control-panel">第 1 集動畫自動播放中...</div>

<script>
    const bubblePipi = document.getElementById('bubblePipi');
    const bubbleMonster = document.getElementById('bubbleMonster');
    const pipi = document.getElementById('pipi');
    const monster = document.getElementById('monster');
    const pixelBox = document.getElementById('pixelBox');
    const magicKey = document.getElementById('magicKey');
    const endingScreen = document.getElementById('endingScreen');
    const stage = document.querySelector('.stage');

    // 動態加入雲朵背景
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.innerText = '☁️ ☁️';
    stage.appendChild(cloud);

    // 時間軸劇情
    setTimeout(() => {
        bubblePipi.style.display = 'block';
        bubblePipi.innerText = "咦？草地上怎麼有一個奇怪的像素寶箱？";
    }, 1000);

    setTimeout(() => {
        bubblePipi.style.display = 'none';
        bubbleMonster.style.display = 'block';
        bubbleMonster.innerText = "吼嚕嚕！裡面會不會有傳說中的餅乾！";
    }, 4500);

    setTimeout(() => {
        bubbleMonster.style.display = 'none';
        pipi.style.transform = 'translateX(260px)';
    }, 8000);

    setTimeout(() => {
        pixelBox.style.transform = 'scale(1.3) rotate(15deg)';
        magicKey.style.opacity = '1';
        magicKey.style.transform = 'translateY(-40px)';
    }, 11000);

    setTimeout(() => {
        bubblePipi.style.display = 'block';
        bubblePipi.innerText = "哇！是平台管理員的「分級權限鑰匙」！✨";
    }, 13000);

    setTimeout(() => {
        bubblePipi.style.display = 'none';
        bubbleMonster.style.display = 'block';
        bubbleMonster.innerText = "太神啦！這樣就能解鎖更多秘密影片了！";
        monster.style.transform = 'scale(1.2) translateY(-10px)';
    }, 16500);

    setTimeout(() => {
        bubbleMonster.style.display = 'none';
        bubblePipi.style.display = 'block';
        bubblePipi.innerText = "走吧！我們趕快把鑰匙拿去登入系統！";
        pipi.style.transform = 'translateX(400px) scaleX(-1)';
    }, 20000);

    setTimeout(() => {
        bubblePipi.style.display = 'none';
        monster.style.transform = 'translateX(350px)';
    }, 23000);

    setTimeout(() => {
        stage.style.boxShadow = '0 0 40px #ffcc00';
        endingScreen.style.opacity = '1';
    }, 26000);
</script>

</body>
</html>
